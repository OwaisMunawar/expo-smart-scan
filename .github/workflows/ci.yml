name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          CI: true
      - run: npm run build

  ios:
    name: iOS example build
    runs-on: macos-26
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      - name: Prebuild
        working-directory: example
        run: npx expo prebuild --platform ios --no-install
      - name: Pod install
        working-directory: example/ios
        run: pod install
      - name: Build for simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace SmartScan.xcworkspace \
            -scheme SmartScan \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 50

  android:
    name: Android module compile
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm ci
        working-directory: example
      - name: Prebuild
        working-directory: example
        run: npx expo prebuild --platform android --no-install
      - name: Compile module
        working-directory: example/android
        run: ./gradlew :expo-smart-scan:compileDebugKotlin --no-daemon
