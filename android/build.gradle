plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smartscan'
version = '0.1.0'

android {
  namespace "expo.modules.smartscan"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled Latin model: works offline from first launch, at the cost of ~4 MB per ABI.
  // The unbundled Play Services variant would download on demand instead.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
